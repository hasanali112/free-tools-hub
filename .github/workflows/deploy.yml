name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Without a custom domain the site lives at https://<owner>.github.io/<repo>/ (needs a base path).
      # To use a custom domain, add a repository variable CUSTOM_DOMAIN (e.g. tools.example.com):
      # Settings → Secrets and variables → Actions → Variables. No code change needed.
      NEXT_PUBLIC_BASE_PATH: ${{ vars.CUSTOM_DOMAIN == '' && format('/{0}', github.event.repository.name) || '' }}
      NEXT_PUBLIC_SITE_URL: ${{ vars.CUSTOM_DOMAIN != '' && format('https://{0}', vars.CUSTOM_DOMAIN) || format('https://{0}.github.io/{1}', github.repository_owner, github.event.repository.name) }}
      # Optional: add these as repository variables (Settings → Secrets and variables → Actions → Variables)
      NEXT_PUBLIC_GA_ID: ${{ vars.NEXT_PUBLIC_GA_ID }}
      NEXT_PUBLIC_GSC_VERIFICATION: ${{ vars.NEXT_PUBLIC_GSC_VERIFICATION }}
      NEXT_PUBLIC_ADSTERRA_NATIVE_SRC: ${{ vars.NEXT_PUBLIC_ADSTERRA_NATIVE_SRC }}
      NEXT_PUBLIC_ADSTERRA_NATIVE_CONTAINER: ${{ vars.NEXT_PUBLIC_ADSTERRA_NATIVE_CONTAINER }}
      NEXT_PUBLIC_ADSTERRA_NATIVE2_SRC: ${{ vars.NEXT_PUBLIC_ADSTERRA_NATIVE2_SRC }}
      NEXT_PUBLIC_ADSTERRA_NATIVE2_CONTAINER: ${{ vars.NEXT_PUBLIC_ADSTERRA_NATIVE2_CONTAINER }}
      NEXT_PUBLIC_ADSTERRA_SOCIALBAR_SRC: ${{ vars.NEXT_PUBLIC_ADSTERRA_SOCIALBAR_SRC }}
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # Stop GitHub Pages from running Jekyll (it would hide the _next folder).
      - run: touch out/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
